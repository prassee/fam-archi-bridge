[package]
name = "wal_consumer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
futures = "0.3"
rdkafka = { version = "0.36", features = ["cmake-build"] }
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

# Use arrow v58 which fixes the quarter() trait conflict
arrow = { version = "58.0", default-features = false, features = ["ipc", "csv", "json"] }
arrow-schema = "58.0"

# Iceberg from Git main branch 
iceberg = { git = "https://github.com/apache/iceberg-rust.git", branch = "main" }

# OpenDAL - for S3/MinIO storage backend support
opendal = { version = "0.50", features = ["services-s3", "services-memory"] }
