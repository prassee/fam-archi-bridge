---
# ─────────────────────────────────────────────────────────────
# MinIO StatefulSet
# Object storage backend for Polaris/Iceberg catalogs
# Ports: 9000 (S3 API), 9001 (console)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: cdc
  labels:
    app: minio
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: cdc
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/minio/v2/metrics/cluster"
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        imagePullPolicy: IfNotPresent
        command:
          - minio
          - server
          - /data
          - --console-address
          - ":9001"
        ports:
        - containerPort: 9000
          name: s3-api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          value: minioadmin
        - name: MINIO_ROOT_PASSWORD
          value: minioadmin
        - name: MINIO_REGION_NAME
          value: us-east-1
        volumeMounts:
        - name: minio-storage
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
      volumes:
      - name: minio-storage
        persistentVolumeClaim:
          claimName: minio-pvc

---
# ─────────────────────────────────────────────────────────────
# MinIO Service
# Exposes S3 API on port 9000, console on port 9001
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cdc
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    name: s3-api
  - port: 9001
    targetPort: 9001
    name: console
  selector:
    app: minio

---
# ─────────────────────────────────────────────────────────────
# MinIO Init Job
# Creates default buckets: iceberg, warehouse, data-lake
# Uses mc (minio-client) CLI
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: cdc
  labels:
    app: minio-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: minio-init
        image: minio/mc:latest
        env:
        - name: MC_HOST_minio
          value: "http://minioadmin:minioadmin@minio.cdc.svc.cluster.local:9000"
        command:
          - sh
          - -c
          - |
            echo "Waiting for MinIO to be ready..."
            until mc alias ls minio &>/dev/null; do
              echo "MinIO not ready, retrying..."
              sleep 2
            done
            echo "MinIO ready!"
            
            # Create buckets
            for bucket in iceberg warehouse data-lake; do
              if mc ls minio/$bucket &>/dev/null; then
                echo "Bucket $bucket already exists"
              else
                echo "Creating bucket $bucket..."
                mc mb minio/$bucket
              fi
            done
            
            echo "MinIO initialization complete"
            exit 0
