apiVersion: v1
kind: ServiceAccount
metadata:
  name: kite
  namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kite
  namespace: kube-system
  labels:
    app: kite
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kite
  template:
    metadata:
      labels:
        app: kite
    spec:
      serviceAccountName: kite
      containers:
        - name: kite
          image: ghcr.io/kite-org/kite:latest
          ports:
            - containerPort: 8080
          env:
            - name: KITE_INSECURE
              value: "true"
---
apiVersion: v1
kind: Service
metadata:
  name: kite
  namespace: kube-system
spec:
  type: NodePort
  selector:
    app: kite
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kite
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: kite
    namespace: kube-system
