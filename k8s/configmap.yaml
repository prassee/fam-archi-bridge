apiVersion: v1
kind: ConfigMap
metadata:
  name: wal-writer-config
  namespace: cdc
  labels:
    app: wal-writer
data:
  WAL_WRITER_PG_HOST: "postgres.cdc.svc.cluster.local"
  WAL_WRITER_PG_PORT: "5432"
  WAL_WRITER_PG_USER: "postgres"
  WAL_WRITER_PG_DATABASE: "postgres"
  WAL_WRITER_PG_SLOT_NAME: "wal_writer_slot_v2"
  WAL_WRITER_KAFKA_BROKERS: "kafka.cdc.svc.cluster.local:9092"
  WAL_WRITER_KAFKA_TOPIC_PREFIX: "cdc"
  WAL_WRITER_KAFKA_ACKS: "all"
  WAL_WRITER_KAFKA_LINGER_MS: "10"
  WAL_WRITER_KAFKA_BATCH_SIZE: "1048576"
  WAL_WRITER_KAFKA_QUEUE_BUFFERING_MAX_MS: "100"
  WAL_WRITER_KAFKA_COMPRESSION: "snappy"
  WAL_WRITER_NUM_PUBLISHERS: "4"
  WAL_WRITER_PUBLICATION: "wal_writer_publication"
  WAL_WRITER_REPLICATION_BATCH_SIZE: "5000"
  WAL_WRITER_REPLICATION_POLL_INTERVAL_MS: "50"
  WAL_WRITER_PENDING_BATCH_QUEUE_SIZE: "50000"
  WAL_WRITER_LOGGING_LEVEL: "info"
  WAL_WRITER_LOGGING_DIRECTORY: "/var/log/wal-writer"
  WAL_WRITER_DEBUG_NO_KAFKA: "false"
  WAL_WRITER_DEBUG_PRINT_WAL: "false"
  WAL_WRITER_STATE_DIR: "/var/run/wal-writer/state"
  WAL_WRITER_STATE_PERSIST_INTERVAL_SECS: "10"
  WAL_WRITER_MAX_PUBLISH_RETRIES: "5"
  WAL_WRITER_ENABLE_DLQ: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: wal-writer-secret
  namespace: cdc
  labels:
    app: wal-writer
type: Opaque
stringData:
  WAL_WRITER_PG_PASSWORD: "postgres"