---
# ─────────────────────────────────────────────────────────────
# Promtail ConfigMap (log scrape config + pipeline)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: cdc
  labels:
    app: promtail
data:
  promtail-config.yaml: |
    server:
      http_listen_port: 3101
      log_level: info

    positions:
      filename: /tmp/positions.yaml

    clients:
      - url: http://loki.cdc.svc.cluster.local:3100/loki/api/v1/push

    scrape_configs:
      - job_name: kubernetes_pod_logs
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - cdc
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: app
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_controller_name]
            target_label: job
          - source_labels: [__meta_kubernetes_pod_controller_kind]
            target_label: kind
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
        pipeline_stages:
          - json:
              expressions:
                level: level
                msg: message
                timestamp: timestamp
          - timestamp:
              source: timestamp
              format: "2006-01-02T15:04:05Z07:00"
              fallback_formats:
                - Unix
              location: UTC
          - labels:
              app:
              namespace:
              pod:
              container:
              job:
              kind:
              node:
          - output:
              source: msg

---
# ─────────────────────────────────────────────────────────────
# Promtail DaemonSet (runs on all nodes)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: cdc
  labels:
    app: promtail
spec:
  selector:
    matchLabels:
      app: promtail
  template:
    metadata:
      labels:
        app: promtail
    spec:
      serviceAccountName: promtail
      hostNetwork: false
      hostPID: false
      containers:
      - name: promtail
        image: grafana/promtail:latest
        imagePullPolicy: IfNotPresent
        args:
          - -config.file=/etc/promtail/promtail-config.yaml
        ports:
        - name: http
          containerPort: 3101
          protocol: TCP
        env:
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: TZ
          value: UTC
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /metrics
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        volumeMounts:
        - name: promtail-config
          mountPath: /etc/promtail
        - name: varlog
          mountPath: /var/log
          readOnly: true
        - name: varlibdockercontainers
          mountPath: /var/lib/docker/containers
          readOnly: true
        - name: etcmachineid
          mountPath: /etc/machine-id
          readOnly: true
        - name: tmp
          mountPath: /tmp
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: promtail-config
        configMap:
          name: promtail-config
      - name: varlog
        hostPath:
          path: /var/log
      - name: varlibdockercontainers
        hostPath:
          path: /var/lib/docker/containers
      - name: etcmachineid
        hostPath:
          path: /etc/machine-id
          type: File
      - name: tmp
        emptyDir: {}
      tolerations:
        - effect: NoSchedule
          operator: Exists
        - effect: NoExecute
          operator: Exists

---
# ─────────────────────────────────────────────────────────────
# Promtail Service (for metrics scraping)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: promtail
  namespace: cdc
  labels:
    app: promtail
spec:
  type: ClusterIP
  selector:
    app: promtail
  ports:
  - name: http
    port: 3101
    targetPort: http
    protocol: TCP

---
# ─────────────────────────────────────────────────────────────
# Promtail ServiceAccount
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: cdc
  labels:
    app: promtail

---
# ─────────────────────────────────────────────────────────────
# Promtail ClusterRole (read pod logs)
# ─────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
  labels:
    app: promtail
rules:
  - apiGroups:
      - ''
    resources:
      - nodes
      - nodes/proxy
      - services
      - endpoints
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch
  - nonResourceURLs:
      - /metrics
    verbs:
      - get

---
# ─────────────────────────────────────────────────────────────
# Promtail ClusterRoleBinding
# ─────────────────────────────────────────────────────────────
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
  labels:
    app: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: cdc
