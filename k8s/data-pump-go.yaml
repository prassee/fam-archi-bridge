apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-pump-go
  namespace: cdc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-pump-go
  template:
    metadata:
      labels:
        app: data-pump-go
    spec:
      containers:
      - name: data-pump-go
        image: data-pump-go:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DB_HOST
          value: postgres.cdc.svc.cluster.local
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: postgres
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wal-writer-secret
              key: WAL_WRITER_PG_PASSWORD
        - name: DB_NAME
          value: postgres
        - name: DATA_PUMP_TARGET_PER_SEC
          value: "9900"
        - name: DATA_PUMP_BATCH_SIZE
          value: "500"
        - name: DATA_PUMP_USERS_BATCH_SIZE
          value: "100"
        - name: DATA_PUMP_NUM_WORKERS
          value: "30"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
      restartPolicy: Always
