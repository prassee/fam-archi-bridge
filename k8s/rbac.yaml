apiVersion: v1
kind: Namespace
metadata:
  name: cdc
---
apiVersion: v1
kind: Namespace
metadata:
  name: cdc
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wal-writer
  namespace: cdc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wal-writer
  namespace: cdc
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wal-writer
  namespace: cdc
subjects:
- kind: ServiceAccount
  name: wal-writer
  namespace: cdc
roleRef:
  kind: Role
  name: wal-writer
  apiGroup: rbac.authorization.k8s.io