---
# ─────────────────────────────────────────────────────────────
# Polaris ConfigMap — Quarkus + feature flags (application.properties)
# Mounted at /deployments/config/application.properties, which Quarkus
# automatically loads as an additional config source.
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-config
  namespace: cdc
  labels:
    app: polaris
data:
  application.properties: |
    quarkus.log.file.enabled=false
    quarkus.otel.sdk.disabled=true
    polaris.readiness.ignore-severe-issues=true
    polaris.persistence.type=relational-jdbc
    polaris.persistence.auto-bootstrap-types=relational-jdbc
    polaris.features."DROP_WITH_PURGE_ENABLED"=true
    polaris.features."ALLOW_INSECURE_STORAGE_TYPES"=true
    polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES"=["FILE","S3","GCS","AZURE"]
    polaris.features."ALLOW_OVERLAPPING_CATALOG_URLS"=true
    polaris.features."ALLOW_NAMESPACE_CUSTOM_LOCATION"=true
    polaris.features."ENABLE_CATALOG_FEDERATION"=true

---
# ─────────────────────────────────────────────────────────────
# Polaris Secret (bootstrap credentials)
# CLIENT_ID=root, CLIENT_SECRET=s3cr3t (change for production)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: polaris-credentials
  namespace: cdc
  labels:
    app: polaris
type: Opaque
stringData:
  # Format: REALM,CLIENT_ID,CLIENT_SECRET
  POLARIS_BOOTSTRAP_CREDENTIALS: "POLARIS,root,s3cr3t"
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
  QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://postgres.cdc.svc.cluster.local:5432/postgres"
  QUARKUS_DATASOURCE_USERNAME: "postgres"
  QUARKUS_DATASOURCE_PASSWORD: "postgres"

---
# ─────────────────────────────────────────────────────────────
# Apache Polaris Deployment (Iceberg REST catalog)
# Ports: 8181 (catalog REST API), 8182 (management/health)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: polaris
  namespace: cdc
  labels:
    app: polaris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8182"
        prometheus.io/path: "/q/metrics"
    spec:
      containers:
      - name: polaris
        image: apache/polaris:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8181
          name: catalog
        - containerPort: 8182
          name: management
        env:
        - name: AWS_REGION
          value: "us-east-1"
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: polaris-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: polaris-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: POLARIS_BOOTSTRAP_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: polaris-credentials
              key: POLARIS_BOOTSTRAP_CREDENTIALS
        - name: POLARIS_PERSISTENCE_TYPE
          value: relational-jdbc
        - name: POLARIS_PERSISTENCE_AUTO_BOOTSTRAP_TYPES
          value: relational-jdbc
        - name: QUARKUS_DATASOURCE_JDBC_URL
          valueFrom:
            secretKeyRef:
              name: polaris-credentials
              key: QUARKUS_DATASOURCE_JDBC_URL
        - name: QUARKUS_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: polaris-credentials
              key: QUARKUS_DATASOURCE_USERNAME
        - name: QUARKUS_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: polaris-credentials
              key: QUARKUS_DATASOURCE_PASSWORD
        volumeMounts:
        - name: polaris-config
          mountPath: /deployments/config
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 8182
          initialDelaySeconds: 60
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 8182
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: polaris-config
        configMap:
          name: polaris-config

---
# ─────────────────────────────────────────────────────────────
# Polaris Service
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: polaris
  namespace: cdc
  labels:
    app: polaris
spec:
  type: ClusterIP
  ports:
  - port: 8181
    targetPort: 8181
    name: catalog
  - port: 8182
    targetPort: 8182
    name: management
  selector:
    app: polaris

---
# ─────────────────────────────────────────────────────────────
# Polaris Init Job
# Creates a default Iceberg catalog in Polaris backed by MinIO.
# Re-runnable and idempotent.
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-init
  namespace: cdc
  labels:
    app: polaris-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: polaris-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: polaris-init
        image: alpine:3.20
        env:
        - name: CLIENT_ID
          value: root
        - name: CLIENT_SECRET
          value: s3cr3t
        - name: REALM
          value: POLARIS
        - name: CATALOG_NAME
          value: quickstart_catalog
        - name: STORAGE_LOCATION
          value: s3://iceberg-warehouse/quickstart_catalog
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -e
            apk add --no-cache curl jq

            echo "Waiting for Polaris health endpoint..."
            until curl -sf http://polaris.cdc.svc.cluster.local:8182/q/health > /dev/null; do
              sleep 3
            done

            TOKEN=$(curl --fail-with-body -s \
              http://polaris.cdc.svc.cluster.local:8181/api/catalog/v1/oauth/tokens \
              --user ${CLIENT_ID}:${CLIENT_SECRET} \
              -H "Polaris-Realm: ${REALM}" \
              -d grant_type=client_credentials \
              -d scope=PRINCIPAL_ROLE:ALL | jq -r .access_token)

            if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
              echo "Failed to obtain Polaris token"
              exit 1
            fi

            if curl -sf \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Polaris-Realm: ${REALM}" \
              "http://polaris.cdc.svc.cluster.local:8181/api/management/v1/catalogs/${CATALOG_NAME}" > /dev/null; then
              echo "Catalog ${CATALOG_NAME} already exists, skipping creation"
              exit 0
            fi

            PAYLOAD=$(cat <<'JSON'
            {
              "catalog": {
                "name": "quickstart_catalog",
                "type": "INTERNAL",
                "readOnly": false,
                "properties": {
                  "default-base-location": "s3://iceberg-warehouse/quickstart_catalog"
                },
                "storageConfigInfo": {
                  "storageType": "S3",
                  "allowedLocations": ["s3://iceberg-warehouse/quickstart_catalog"],
                  "region": "us-east-1",
                  "endpoint": "http://minio.cdc.svc.cluster.local:9000",
                  "pathStyleAccess": true,
                  "stsUnavailable": true
                }
              }
            }
            JSON
            )

            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "Polaris-Realm: ${REALM}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              http://polaris.cdc.svc.cluster.local:8181/api/management/v1/catalogs \
              -d "${PAYLOAD}"

            echo "Catalog ${CATALOG_NAME} created successfully"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
