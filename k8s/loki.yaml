---
# ─────────────────────────────────────────────────────────────
# Loki ConfigMap (storage, retention, schema)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: cdc
  labels:
    app: loki
data:
  loki-config.yaml: |
    auth_enabled: false
    
    target: all

    server:
      http_listen_port: 3100
      log_level: info

    ingester:
      chunk_idle_period: 3m
      max_chunk_age: 1h
      chunk_retain_period: 1m
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1

    limits_config:
      reject_old_samples: true
      ingestion_rate_mb: 10

    schema_config:
      configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /loki/index
        cache_location: /loki/cache
      filesystem:
        directory: /loki/chunks

    querier:
      max_concurrent: 20

    query_range:
      align_queries_with_step: true
      cache_results: true

---
# ─────────────────────────────────────────────────────────────
# Loki StatefulSet (single replica for dev/test)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: cdc
  labels:
    app: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      serviceAccountName: loki
      initContainers:
      - name: init-loki
        image: busybox:1.35
        command: ['sh', '-c', 'mkdir -p /loki/{chunks,index,cache,compactor,wal} && chmod -R 777 /loki']
        volumeMounts:
        - name: loki-storage
          mountPath: /loki
      containers:
      - name: loki
        image: grafana/loki:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3100
          protocol: TCP
        args:
          - -config.file=/etc/loki/loki-config.yaml
        env:
        - name: TZ
          value: UTC
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: loki-config
          mountPath: /etc/loki
        - name: loki-storage
          mountPath: /loki
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
      volumes:
      - name: loki-config
        configMap:
          name: loki-config
  volumeClaimTemplates:
  - metadata:
      name: loki-storage
      labels:
        app: loki
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi

---
# ─────────────────────────────────────────────────────────────
# Loki Service (headless for StatefulSet DNS)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: cdc
  labels:
    app: loki
spec:
  clusterIP: None
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: http
    protocol: TCP

---
# ─────────────────────────────────────────────────────────────
# Loki ServiceAccount (for pod security)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  namespace: cdc
  labels:
    app: loki
