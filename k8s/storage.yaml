---
# ─────────────────────────────────────────────────────────────
# MinIO Secret (root credentials)
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: cdc
  labels:
    app: minio
type: Opaque
stringData:
  MINIO_ROOT_USER: minioadmin
  MINIO_ROOT_PASSWORD: minioadmin

---
# ─────────────────────────────────────────────────────────────
# MinIO StatefulSet
# Image: pgsty/minio (community fork of minio/minio with embedded console)
# Ports: 9000 (S3 API), 9001 (console UI)
# ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: cdc
  labels:
    app: minio
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: pgsty/minio:latest
        command: ["minio", "server", "/data", "--console-address", ":9001"]
        ports:
        - containerPort: 9000
          name: s3-api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ROOT_PASSWORD
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /minio/health/live
            port: 9000
          initialDelaySeconds: 30
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
  volumeClaimTemplates:
  - metadata:
      name: minio-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 20Gi

---
# ─────────────────────────────────────────────────────────────
# MinIO Service
# ─────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: cdc
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
  - port: 9000
    targetPort: 9000
    name: s3-api
  - port: 9001
    targetPort: 9001
    name: console
  selector:
    app: minio

---
# ─────────────────────────────────────────────────────────────
# MinIO Init Job — creates the iceberg-warehouse bucket
# ─────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: cdc
  labels:
    app: minio-init
spec:
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
      - name: mc
        image: minio/mc:latest
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ROOT_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: MINIO_ROOT_PASSWORD
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "Waiting for MinIO to be ready..."
            until mc alias set myminio http://minio.cdc.svc.cluster.local:9000 \
              "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"; do
              sleep 3
            done
            mc mb myminio/iceberg-warehouse --ignore-existing
            echo "Bucket iceberg-warehouse ready."
            mc ls myminio
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi

---
# ─────────────────────────────────────────────────────────────
# Polaris resources moved to k8s/polaris.yaml
