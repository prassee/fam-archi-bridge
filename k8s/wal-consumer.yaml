apiVersion: apps/v1
kind: Deployment
metadata:
  name: wal-consumer
  namespace: cdc
  labels:
    app: wal-consumer
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wal-consumer
  template:
    metadata:
      labels:
        app: wal-consumer
    spec:
      serviceAccountName: wal-writer
      containers:
      - name: wal-consumer
        image: wal-consumer:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: WAL_CONSUMER_CONFIG
          value: /etc/wal-consumer/wal_consumer_config.toml
        - name: RUST_LOG
          value: info
        volumeMounts:
        - name: config
          mountPath: /etc/wal-consumer
          readOnly: true
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
      volumes:
      - name: config
        configMap:
          name: wal-consumer-config
          items:
          - key: wal_consumer_config.toml
            path: wal_consumer_config.toml
        - name: WAL_CONSUMER_PG_DATABASE
          value: postgres
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      restartPolicy: Always
