# Docker Compose manifest derived from Kubernetes manifests in k8s/ folder
# Includes all services, configurations, volumes, and environment variables

services:
  # PostgreSQL with logical replication enabled
  # Derived from k8s/postgres.yaml
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_wal_size=5GB"
      - "-c"
      - "max_slot_wal_keep_size=5120"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    # Resource hints (K8s requests: 500m CPU, 512Mi memory; limits: 1000m CPU, 1Gi memory)

    # Kafka broker
    # Derived from k8s/kafka.yaml
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    # Resource hints (K8s requests: 500m CPU, 1Gi memory; limits: 1000m CPU, 2Gi memory)

    # Data Pump Go service - UPI transaction generator
    # Equivalent to data_pump Python project but written in Go
  data-pump-go:
    image: data-pump-go:latest
    container_name: data-pump-go
    build:
      context: ./data_pump_go
      dockerfile: Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: postgres
      DATA_PUMP_TARGET_PER_SEC: "5000"
      DATA_PUMP_BATCH_SIZE: "500"
      DATA_PUMP_USERS_BATCH_SIZE: "100"
      DATA_PUMP_NUM_WORKERS: "20"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Note: This service generates UPI transaction data for testing
    # It continuously inserts data at ~20,000 txns/sec

    # Database initialization - creates replication slot
    # Runs right after postgres is healthy
  db-init:
    image: postgres:16-alpine
    container_name: db-init
    environment:
      PGPASSWORD: postgres
      PGUSER: postgres
      PGDATABASE: postgres
      PGHOST: postgres
      PGPORT: 5432
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        echo "Waiting for PostgreSQL to be ready..."
        until pg_isready -h postgres -p 5432 -U postgres; do
          sleep 2
        done
        echo "PostgreSQL is ready. Creating replication slot and publication if not exists..."
        psql -h postgres -p 5432 -U postgres -d postgres <<-EOSQL
          SELECT pg_create_logical_replication_slot('wal_writer_slot_v2', 'pgoutput', false, false) WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name = 'wal_writer_slot_v2');
          SELECT slot_name, plugin, slot_type, active FROM pg_replication_slots WHERE slot_name = 'wal_writer_slot_v2';
          SELECT pubname, puballtables FROM pg_publication WHERE pubname = 'wal_writer_publication';
        EOSQL
        psql -h postgres -p 5432 -U postgres -d postgres -c "CREATE PUBLICATION wal_writer_publication FOR ALL TABLES" 2>/dev/null || echo "Publication already exists"
        psql -h postgres -p 5432 -U postgres -d postgres -c "SELECT pubname, puballtables FROM pg_publication WHERE pubname = 'wal_writer_publication';"
        echo "Replication slot and publication check/creation completed."
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Kafka Exporter for Prometheus
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    hostname: kafka-exporter
    ports:
      - "9308:9308"
    command:
      - "--kafka.server=kafka:9092"
      - "--offset.show-all"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL Exporter for Prometheus
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    hostname: postgres-exporter
    ports:
      - "9187:9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Prometheus - metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - postgres-exporter
    restart: unless-stopped

  # Grafana - metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: ""
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - |
        set -e
        mkdir -p /var/lib/grafana/dashboards
        # Use local dashboard if available, otherwise download
        if [ ! -f /var/lib/grafana/dashboards/kafka-exporter.json ]; then
          curl -fsSL "https://grafana.com/api/dashboards/7589/revisions/1/download" -o /var/lib/grafana/dashboards/kafka-exporter.json || true
        fi
        /run.sh
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboard-json:/var/lib/grafana/dashboards
    depends_on:
      - prometheus
    restart: unless-stopped

  # Rust WAL Writer service (active CDC agent)
  wal-writer-rust:
    image: wal-writer-rust:latest
    container_name: wal-writer-rust
    hostname: wal-writer-rust
    build:
      context: .
      dockerfile: wal_writer/Dockerfile
    ports:
      - "9095:9090"
    environment:
      WAL_WRITER_PG_HOST: postgres
      WAL_WRITER_PG_PORT: 5432
      WAL_WRITER_PG_USER: postgres
      WAL_WRITER_PG_PASSWORD: postgres
      WAL_WRITER_PG_DATABASE: postgres
      WAL_WRITER_PG_SLOT_NAME: wal_writer_slot_v2
      WAL_WRITER_KAFKA_BROKERS: kafka:9092
      WAL_WRITER_KAFKA_TOPIC_PREFIX: cdc
      WAL_WRITER_KAFKA_ACKS: all
      WAL_WRITER_KAFKA_LINGER_MS: 5
      WAL_WRITER_KAFKA_BATCH_SIZE: 16384
      WAL_WRITER_PUBLICATION: wal_writer_publication
      WAL_WRITER_REPLICATION_BATCH_SIZE: 500
      WAL_WRITER_REPLICATION_POLL_INTERVAL_MS: 10
      WAL_WRITER_LOGGING_LEVEL: info
      WAL_WRITER_LOGGING_DIRECTORY: /var/log/wal-writer
      WAL_WRITER_DEBUG_NO_KAFKA: "false"
      WAL_WRITER_DEBUG_PRINT_WAL: "true"
    volumes:
      - logs-data:/var/log/wal-writer
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/health" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    # WAL Consumer service
    # Consumes CDC messages from Kafka and prints them to stdout
  wal-consumer:
    image: wal-consumer:latest
    container_name: wal-consumer
    hostname: wal-consumer
    build:
      context: .
      dockerfile: wal_consumer/Dockerfile
    environment:
      WAL_WRITER_KAFKA_BROKERS: kafka:9092
      WAL_WRITER_KAFKA_TOPIC_PREFIX: cdc
      WAL_CONSUMER_GROUP_ID: wal-consumer-console
      RUST_LOG: info
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local
    # K8s: 5Gi storage
  kafka-data:
    driver: local
    # K8s: 10Gi storage
  logs-data:
    driver: local
    # K8s: emptyDir with sizeLimit 1Gi
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  # Note: kafka-exporter is stateless, no volume needed

  # Note: The following K8s features are not directly supported in Docker Compose:
  # - Namespace (k8s/rbac.yaml creates namespace "cdc")
  # - ServiceAccount, Role, RoleBinding (k8s/rbac.yaml)
  # - PodDisruptionBudget (k8s/deployment.yaml)
  # - Pod anti-affinity (k8s/deployment.yaml)
  # - StatefulSet (k8s/postgres.yaml, k8s/kafka.yaml - using regular services instead)
  # - ConfigMap and Secret separation (using environment variables directly)
  # - livenessProbe and readinessProbe paths (/health, /ready on port 9090)
